# Host nginx on Firebat: the project's own domain, canonical from the switchover on.
#
# Same shape as chess.waxim.ru.conf — the skill is public and must NOT be behind
# basic auth, because Alice cannot authenticate. Protection is TLS, body/time
# limits and rate limiting.
#
# Certificate: this domain is outside the *.waxim.ru wildcard, so it uses the
# webroot (HTTP-01) authenticator, like hire.jzazik.com. No Cloudflare needed.
#
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d yurachess.ru -d www.yurachess.ru
#
# Install both this file and chess.waxim.ru.conf together: the old host only
# stops answering directly once its redirect block is live.

limit_req_zone $binary_remote_addr zone=yurachess_webhook:10m rate=200r/s;

upstream yurachess_app {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name yurachess.ru www.yurachess.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://yurachess.ru$request_uri;
    }
}

server {
    # Firebat's stream layer owns public :443 and forwards web TLS here with the
    # PROXY protocol. The SNI demux needs no entry: everything but turn.waxim.ru
    # already lands on this listener, and server_name sorts it out.
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name www.yurachess.ru;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/yurachess.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yurachess.ru/privkey.pem;
    auth_basic off;

    # One canonical host, so www never accumulates its own index.
    return 301 https://yurachess.ru$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name yurachess.ru;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/yurachess.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yurachess.ru/privkey.pem;
    auth_basic off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # An Alice payload is small; anything larger is not a webhook.
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;

    access_log /var/log/nginx/yurachess.ru.access.log;
    error_log  /var/log/nginx/yurachess.ru.error.log warn;

    # Crawler files get their own exact-match locations: an exact match wins over
    # every regex and prefix location, so no later rule can shadow them back into
    # the catch-all 404 the way a stale vhost once did.
    location = /robots.txt {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /sitemap.xml {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Indexable pages, the search-console proofs and the IndexNow key. The Yandex
    # proof is per-host: yurachess.ru needs its own file, added here when issued.
    location ~ ^/(?:how-to-play|commands|coach|puzzles|accessibility|blindfold|statistics|yandex_67cb474818f8d2b2\.html|3e123263cd3a154a8aa32da5bc28cebd\.txt|og\.png)?$ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Canonical webhook path. The legacy one below stays forever: the Dialogs
    # console is edited by hand and must never have to match a deploy.
    location = /webhooks/alice {
        limit_req zone=yurachess_webhook burst=400 nodelay;
        limit_req_status 429;

        # A location-level add_header replaces inherited server headers.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Alice abandons the request after 5 s and the skill answers within 4.5;
        # nginx must not hold a connection either side considers dead.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /alice/webhook {
        limit_req zone=yurachess_webhook burst=400 nodelay;
        limit_req_status 429;

        # A location-level add_header replaces inherited server headers.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Alice abandons the request after 5 s and the skill answers within 4.5;
        # nginx must not hold a connection either side considers dead.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location ~ ^/favicon\.(?:svg|ico)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://yurachess_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
